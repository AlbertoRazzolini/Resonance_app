# Blueprint Render: database + un solo servizio web (progettazione, sezioni 1.1 e 12.5).
# Su Render: New > Blueprint > repository > Apply. Il passo guidato e' la card F2-03.
#
# Un solo servizio: il backend Spring Boot serve le API e, dal 20 ottobre, anche il frontend React
# (stessa origine: cookie di refresh di prima parte e nessun CORS in produzione). Per ora
# l'immagine contiene solo il backend. Nessun dominio personalizzato: l'indirizzo e'
# https://<nome-servizio>.onrender.com, assegnato da Render alla creazione.

databases:
  - name: resonance-db
    databaseName: resonance
    user: resonance
    plan: free
    region: frankfurt
    # Allineato al PostgreSQL di sviluppo (postgres:17 in docker-compose.yml); non si puo' modificare
    # dopo la creazione del database.
    postgresMajorVersion: "17"

services:
  - type: web
    name: resonance
    runtime: docker
    plan: free
    region: frankfurt
    # Il contesto di build e' la radice del repository (il Dockerfile deve poter leggere anche
    # Resonance_FE); dockerfilePath si legge dalla radice.
    dockerContext: .
    dockerfilePath: ./Resonance_BE/Dockerfile
    # Il deploy parte solo dai push su main: il merge develop -> main lo fa lo studente a fine fase.
    branch: main
    autoDeploy: true
    # Pubblico anche con Spring Security (progettazione, sezione 6.11).
    healthCheckPath: /api/health
    # Una modifica a documenti o collection Postman non rifa il deploy.
    buildFilter:
      paths:
        - Resonance_BE/**
        - Resonance_FE/**
        - .dockerignore
        - render.yaml
    envVars:
      # Collegata al database di questo Blueprint; DatabaseUrl la converte in URL JDBC mantenendo i
      # parametri dell'URL (non aggiunge sslmode) e non stampa mai la password (progettazione, sezione 12.3).
      - key: DATABASE_URL
        fromDatabase:
          name: resonance-db
          property: connectionString
      # Con il profilo "prod" i cookie sono Secure e le email partono da Brevo via HTTP (il piano
      # gratuito di Render blocca SMTP). Senza il profilo girerebbe LogEmailService, che scrive i
      # codici nel log: serve solo in locale.
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      # Chiave di firma dei JWT: Render la genera casuale al primo deploy (almeno 32 byte).
      - key: JWT_SECRET
        generateValue: true
      # Durate dei token. Facoltative: senza, il backend usa questi stessi valori (formato Duration).
      - key: ACCESS_TOKEN_TTL
        value: 15m
      - key: REFRESH_TOKEN_TTL
        value: 10d
      # Primo SUPERADMIN, creato all'avvio se non ne esiste gia' uno (progettazione, sezione 4.12).
      # Segreti: si inseriscono nella dashboard di Render, mai in questo file.
      - key: SUPERADMIN_EMAIL
        sync: false
      - key: SUPERADMIN_PASSWORD
        sync: false
      # Chiave API di Brevo (SMTP e API > Chiavi API): una API key, non una SMTP key.
      - key: BREVO_API_KEY
        sync: false
      # Mittente delle email: deve essere un indirizzo confermato in Brevo (Mittenti), identico.
      # Con "prod" attivo e queste due vuote l'email non parte e si scrive un errore nel log.
      - key: MAIL_FROM
        sync: false
      # Contatto (email o URL) inserito nello User-Agent delle richieste a Nominatim.
      - key: GEOCODING_CONTACT
        sync: false
      # ALLOWED_ORIGIN non serve: frontend e API hanno la stessa origine, quindi in produzione
      # nessuna origine esterna e' ammessa (progettazione, sezione 6.12).
