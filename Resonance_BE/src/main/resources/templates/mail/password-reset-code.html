<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="it">
<head>
	<meta charset="UTF-8"/>
	<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
	<title>Reimposta la tua password</title>
</head>
<body style="margin:0; padding:0; background-color:#0f131d;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#0f131d" style="background-color:#0f131d; width:100%;">
	<tr>
		<td align="center" style="padding:32px 16px;">
			<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#111827" style="max-width:600px; width:100%; background-color:#111827; border:1px solid rgba(255,255,255,0.08); border-radius:12px;">
				<tr>
					<td align="center" style="padding:28px 24px 20px 24px; border-bottom:1px solid rgba(255,255,255,0.08);">
						<span style="font-family:Inter,'Segoe UI',Arial,sans-serif; font-size:24px; font-weight:800; letter-spacing:0.5px; color:#dfe2f1;">Reso<span style="color:#a78bfa;">nance</span></span>
					</td>
				</tr>
				<tr>
					<td style="padding:32px 32px 8px 32px; font-family:Inter,'Segoe UI',Arial,sans-serif;">
						<p style="margin:0 0 16px 0; font-size:20px; font-weight:700; color:#dfe2f1;">Ciao <span th:text="${displayName}">nome</span>,</p>
						<p style="margin:0 0 24px 0; font-size:15px; line-height:1.6; color:#c7c4d7;">Hai chiesto di reimpostare la password. Inserisci questo codice nell'app:</p>
					</td>
				</tr>
				<tr>
					<td align="center" style="padding:0 32px 24px 32px;">
						<table role="presentation" cellpadding="0" cellspacing="0" border="0" bgcolor="#0b0f19" style="background-color:#0b0f19; border:1px solid rgba(167,139,250,0.35); border-radius:10px;">
							<tr>
								<td style="padding:16px 32px; font-family:Inter,'Segoe UI',Arial,sans-serif; font-size:32px; font-weight:800; letter-spacing:10px; color:#a78bfa;" th:text="${code}">000000</td>
							</tr>
						</table>
					</td>
				</tr>
				<tr>
					<td style="padding:0 32px 32px 32px; font-family:Inter,'Segoe UI',Arial,sans-serif;">
						<p style="margin:0 0 8px 0; font-size:14px; line-height:1.6; color:#c7c4d7;">Il codice scade tra 15 minuti.</p>
						<p style="margin:0; font-size:14px; line-height:1.6; color:#c7c4d7;">Se non l'hai chiesto tu, ignora questa email: la tua password non cambia.</p>
					</td>
				</tr>
			</table>
		</td>
	</tr>
</table>
</body>
</html>
