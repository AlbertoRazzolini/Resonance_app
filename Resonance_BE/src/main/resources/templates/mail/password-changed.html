<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="it">
<head>
	<meta charset="UTF-8"/>
	<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
	<title>Password cambiata</title>
</head>
<!-- Stile di Resonance (decisione 115): solo tabelle e stili in linea, come richiedono i client email. -->
<body style="margin:0; padding:0; background-color:#0a0a0a;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#0a0a0a" style="background-color:#0a0a0a;">
	<tr>
		<td align="center" style="padding:32px 16px;">
			<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#121212" style="max-width:600px; width:100%; background-color:#121212; border:1px solid #222222; border-radius:12px;">
				<tr>
					<td align="center" bgcolor="#121212" style="padding:32px 24px 24px 24px; background-color:#121212; border-bottom:1px solid #222222;">
						<img th:src="${logoUrl}" src="email-logo.png" width="220" alt="RESONANCE" style="display:block; width:220px; max-width:100%; height:auto; border:0; font-family:'Arial Narrow','Roboto Condensed','Helvetica Neue Condensed','Arial',sans-serif; font-size:30px; font-weight:bold; letter-spacing:4px; color:#f5f5f5;"/>
					</td>
				</tr>
				<tr>
					<td style="padding:32px 32px 8px 32px;">
						<h1 style="margin:0 0 14px 0; font-family:'Arial Narrow','Roboto Condensed','Helvetica Neue Condensed','Arial',sans-serif; font-size:28px; line-height:1.05; font-weight:bold; letter-spacing:0.5px; text-transform:uppercase; color:#f5f5f5;">Password cambiata</h1>
						<table role="presentation" width="40" cellpadding="0" cellspacing="0" border="0" style="margin:0 0 20px 0;"><tr><td width="40" height="3" bgcolor="#ffd60a" style="width:40px; height:3px; line-height:3px; font-size:0; background-color:#ffd60a;">&nbsp;</td></tr></table>
						<p style="margin:0 0 12px 0; font-family:Arial,'Helvetica Neue',Helvetica,sans-serif; font-size:16px; line-height:1.6; color:#f5f5f5;">Ciao <strong th:text="${displayName}">nome</strong>,</p>
						<p style="margin:0 0 20px 0; font-family:Arial,'Helvetica Neue',Helvetica,sans-serif; font-size:16px; line-height:1.6; color:#f5f5f5;">La password del tuo account Resonance è stata cambiata. Per sicurezza sei uscito/a da tutti i dispositivi: accedi di nuovo con la nuova password.</p>
					</td>
				</tr>
				<tr>
					<td style="padding:0 32px 28px 32px;">
						<!-- Qui l'avviso è l'azione da fare: testo bianco e un po' più grande. -->
						<p style="margin:0; padding:2px 0 2px 12px; border-left:3px solid #ffd60a; font-family:Arial,'Helvetica Neue',Helvetica,sans-serif; font-size:15px; line-height:1.6; color:#f5f5f5;">Se non sei stato tu, reimposta subito la password dalla pagina di accesso.</p>
					</td>
				</tr>
				<tr>
					<td align="center" style="padding:18px 24px; border-top:1px solid #222222; font-family:'Arial Narrow','Roboto Condensed','Helvetica Neue Condensed','Arial',sans-serif; font-size:12px; line-height:1.5; letter-spacing:1px; text-transform:uppercase; color:#a3a3a3;">
						Resonance <span style="color:#ffd60a;">&middot;</span> Musica dal vivo e scena indie
					</td>
				</tr>
			</table>
		</td>
	</tr>
</table>
</body>
</html>
